[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rieazuka"
version = "1.0.0"
description = "Cross-platform authorized web security auditing agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "RieaZuka contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
rieazuka = "rieazuka.cli:app"

[tool.setuptools.packages.find]
include = ["rieazuka*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
